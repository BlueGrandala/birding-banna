<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鸟点导航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; width: 100%; }
  .info-box {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,0.95); padding: 8px 12px;
    border-radius: 6px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3); max-width: 260px;
  }
  .info-box b { color: #2c7; }
  .nav-btn {
    display: inline-block; margin-top: 6px; padding: 4px 10px;
    background: #2c7; color: #fff; border: none; border-radius: 4px;
    cursor: pointer; font-size: 12px;
  }
  .nav-btn:active { background: #1a5; }
</style>
</head>
<body>
<div id="map"></div>
<div class="info-box" id="infoBox">正在获取位置…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ====== 1. 鸟点数据（WGS84 经纬度） ======
const birds = [
  { name: "春林宾馆", lng: 101.252282, lat: 21.935425 },
  { name: "鹰鸮", lng: 101.251570, lat: 21.934226 },
  { name: "钳嘴鹳", lng: 101.248890, lat: 21.932088 },
  { name: "东方田鹨", lng: 101.249810, lat: 21.930633 },
  { name: "紫金鹃", lng: 101.249048, lat: 21.927890 },
  { name: "赤胸拟啄木鸟、黑枕王鹟、蓝须夜蜂虎", lng: 101.24980433, lat: 21.92820576 },
  { name: "栗背伯劳", lng: 101.249613, lat: 21.925142 },
  { name: "长嘴捕蛛鸟", lng: 101.249241, lat: 21.925575 },
  { name: "红原鸡", lng: 101.249836, lat: 21.923530 },
  { name: "黄胸织雀", lng: 101.253097, lat: 21.924278 },
  { name: "灰头绿鸠", lng: 101.253222, lat: 21.930785 },
  { name: "红顶鹛", lng: 101.255415, lat: 21.931349 },
  { name: "红顶鹛2", lng: 101.256204, lat: 21.931947 },
  { name: "电站观测点", lng: 101.263503, lat: 21.928159 },
  { name: "黑头鹎", lng: 101.257432, lat: 21.926598 },
  { name: "灰燕鵙", lng: 101.266102, lat: 21.916138 }
];

// ====== 2. 初始化地图 ======
const map = L.map('map').setView([21.928, 101.253], 15);

// 卫星底图（Esri 全球卫星影像，免 key，国内可访问）
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles © Esri'
}).addTo(map);

// 叠加路网/地名标注，方便对照
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, opacity: 0.8
}).addTo(map);

// ====== 3. 画鸟点 ======
const birdMarkers = [];
birds.forEach(b => {
  const m = L.marker([b.lat, b.lng], {
    title: b.name,
    icon: L.divIcon({
      className: 'bird-icon',
      html: '<div style="background:#e33;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px #000;"></div>',
      iconSize: [14,14],
      iconAnchor: [7,7]
    })
  }).addTo(map);
  m.bindPopup(`<b>${b.name}</b><br><span class="dist">距离未知</span><br>
    <button class="nav-btn" onclick="navTo(${b.lat},${b.lng})">导航到此点</button>`);
  m.birdData = b;
  birdMarkers.push(m);
});

// ====== 4. 实时定位 ======
let userMarker = null;
let accuracyCircle = null;
let userLatLng = null;

const infoBox = document.getElementById('infoBox');

function updateInfo() {
  if (!userLatLng) return;
  let html = `<b>我的位置</b><br>${userLatLng.lat.toFixed(6)}, ${userLatLng.lng.toFixed(6)}<br>`;
  // 计算离最近鸟点
  let nearest = null, minD = Infinity;
  birdMarkers.forEach(m => {
    const d = map.distance(userLatLng, [m.birdData.lat, m.birdData.lng]);
    if (d < minD) { minD = d; nearest = m; }
  });
  if (nearest) {
    html += `最近：<b>${nearest.birdData.name}</b><br>距离 ${fmtDist(minD)}`;
  }
  infoBox.innerHTML = html;
  // 更新每个 popup 里的距离
  birdMarkers.forEach(m => {
    const d = map.distance(userLatLng, [m.birdData.lat, m.birdData.lng]);
    const el = m.getPopup()?.getElement()?.querySelector('.dist');
    if (el) el.textContent = `距离 ${fmtDist(d)}`;
  });
}

function fmtDist(m) {
  return m < 1000 ? `${m.toFixed(0)} m` : `${(m/1000).toFixed(2)} km`;
}

function onLocation(e) {
  const { latitude, longitude, accuracy } = e.coords;
  userLatLng = L.latLng(latitude, longitude);

  if (!userMarker) {
    userMarker = L.circleMarker(userLatLng, {
      radius: 8, color: '#fff', weight: 2,
      fillColor: '#2c7', fillOpacity: 1
    }).addTo(map);
    userMarker.bindPopup('我的位置');
    accuracyCircle = L.circle(userLatLng, {
      radius: accuracy, color: '#2c7', weight: 1,
      fillColor: '#2c7', fillOpacity: 0.15
    }).addTo(map);
    map.setView(userLatLng, 17);
  } else {
    userMarker.setLatLng(userLatLng);
    accuracyCircle.setLatLng(userLatLng).setRadius(accuracy);
  }
  updateInfo();
}

function onError(err) {
  infoBox.innerHTML = `定位失败：${err.message}<br>请确保在 HTTPS 或 localhost 下打开，并允许定位权限。`;
}

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(onLocation, onError, {
    enableHighAccuracy: true, maximumAge: 1000, timeout: 15000
  });
} else {
  infoBox.textContent = '浏览器不支持定位';
}

// ====== 5. 导航按钮：跳系统地图 ======
function navTo(lat, lng) {
  // 优先用 geo: URI（手机），浏览器会弹出选择高德/百度/Google Maps
  const geoUrl = `geo:${lat},${lng}?q=${lat},${lng}(鸟点)`;
  // 桌面端兜底：Google Maps
  const webUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    window.location.href = geoUrl;
  } else {
    window.open(webUrl, '_blank');
  }
}

// 默认打开第一个点的 popup，方便看效果
setTimeout(() => birdMarkers[0].openPopup(), 800);
</script>
</body>
</html>
