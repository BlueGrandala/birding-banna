<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鸟点导航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; width: 100%; }
  .info-box {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,0.95); padding: 8px 12px;
    border-radius: 6px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3); max-width: 260px;
  }
  .info-box b { color: #2c7; }
  .nav-btn {
    display: inline-block; margin-top: 6px; padding: 4px 10px;
    background: #2c7; color: #fff; border: none; border-radius: 4px;
    cursor: pointer; font-size: 12px;
  }
  .nav-btn:active { background: #1a5; }
</style>
</head>
<body>
<div id="map"></div>
<div class="info-box" id="infoBox">正在加载 main.kml…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ====== 1. 初始化地图 ======
const map = L.map('map').setView([21.928, 101.253], 15);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles © Esri'
}).addTo(map);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, opacity: 0.8
}).addTo(map);

const infoBox = document.getElementById('infoBox');
const birdMarkers = [];

// ====== 2. 读取并解析同目录 main.kml ======
fetch('main.kml')
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status}，请确认 main.kml 与 html 同目录`);
    return res.text();
  })
  .then(kmlText => {
    const parser = new DOMParser();
    const kmlDoc = parser.parseFromString(kmlText, 'application/xml');

    // 检查 XML 解析错误
    const parseError = kmlDoc.querySelector('parsererror');
    if (parseError) throw new Error('KML 格式错误：' + parseError.textContent);

    // 取所有 Placemark（兼容带命名空间的情况）
    const placemarks = kmlDoc.getElementsByTagNameNS('*', 'Placemark');
    if (placemarks.length === 0) throw new Error('KML 里没有找到 Placemark');

    for (const pm of placemarks) {
      // 名称
      const nameEl = pm.getElementsByTagNameNS('*', 'name')[0];
      const name = nameEl ? nameEl.textContent.trim() : '未命名点';

      // 坐标：取第一个 Point 下的 coordinates
      const coordEl = pm.getElementsByTagNameNS('*', 'coordinates')[0];
      if (!coordEl) continue; // 跳过线/面等非点要素
      const raw = coordEl.textContent.trim();
      // KML 坐标格式：经度,纬度[,高度]
      const parts = raw.split(',');
      if (parts.length < 2) continue;
      const lng = parseFloat(parts[0]);
      const lat = parseFloat(parts[1]);
      if (isNaN(lat) || isNaN(lng)) continue;

      addBirdMarker(name, lat, lng);
    }

    infoBox.innerHTML = `已加载 <b>${birdMarkers.length}</b> 个鸟点<br>正在获取位置…`;

    // 自动缩放到所有点
    if (birdMarkers.length > 0) {
      const group = L.featureGroup(birdMarkers);
      map.fitBounds(group.getBounds().pad(0.2));
    }

    // 默认打开第一个点的 popup
    setTimeout(() => birdMarkers[0]?.openPopup(), 600);
  })
  .catch(err => {
    infoBox.innerHTML = `加载 main.kml 失败：<br>${err.message}`;
    console.error(err);
  });

// ====== 3. 添加单个鸟点 ======
function addBirdMarker(name, lat, lng) {
  const m = L.marker([lat, lng], {
    title: name,
    icon: L.divIcon({
      className: 'bird-icon',
      html: '<div style="background:#e33;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px #000;"></div>',
      iconSize: [14,14],
      iconAnchor: [7,7]
    })
  }).addTo(map);

  m.bindPopup(`<b>${name}</b><br><span class="dist">距离未知</span><br>
    <button class="nav-btn" onclick="navTo(${lat},${lng})">导航到此点</button>`);
  m.birdData = { name, lat, lng };
  birdMarkers.push(m);
}

// ====== 4. 实时定位 ======
let userMarker = null;
let accuracyCircle = null;
let userLatLng = null;

function updateInfo() {
  if (!userLatLng) return;
  let html = `<b>我的位置</b><br>${userLatLng.lat.toFixed(6)}, ${userLatLng.lng.toFixed(6)}<br>`;
  let nearest = null, minD = Infinity;
  birdMarkers.forEach(m => {
    const d = map.distance(userLatLng, [m.birdData.lat, m.birdData.lng]);
    if (d < minD) { minD = d; nearest = m; }
  });
  if (nearest) {
    html += `最近：<b>${nearest.birdData.name}</b><br>距离 ${fmtDist(minD)}`;
  }
  infoBox.innerHTML = html;
  birdMarkers.forEach(m => {
    const d = map.distance(userLatLng, [m.birdData.lat, m.birdData.lng]);
    const el = m.getPopup()?.getElement()?.querySelector('.dist');
    if (el) el.textContent = `距离 ${fmtDist(d)}`;
  });
}

function fmtDist(m) {
  return m < 1000 ? `${m.toFixed(0)} m` : `${(m/1000).toFixed(2)} km`;
}

function onLocation(e) {
  const { latitude, longitude, accuracy } = e.coords;
  userLatLng = L.latLng(latitude, longitude);

  if (!userMarker) {
    userMarker = L.circleMarker(userLatLng, {
      radius: 8, color: '#fff', weight: 2,
      fillColor: '#2c7', fillOpacity: 1
    }).addTo(map);
    userMarker.bindPopup('我的位置');
    accuracyCircle = L.circle(userLatLng, {
      radius: accuracy, color: '#2c7', weight: 1,
      fillColor: '#2c7', fillOpacity: 0.15
    }).addTo(map);
  } else {
    userMarker.setLatLng(userLatLng);
    accuracyCircle.setLatLng(userLatLng).setRadius(accuracy);
  }
  updateInfo();
}

function onError(err) {
  infoBox.innerHTML = `定位失败：${err.message}<br>请确保在 HTTPS 或 localhost 下打开，并允许定位权限。`;
}

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(onLocation, onError, {
    enableHighAccuracy: true, maximumAge: 1000, timeout: 15000
  });
} else {
  infoBox.textContent = '浏览器不支持定位';
}

// ====== 5. 导航按钮 ======
function navTo(lat, lng) {
  const geoUrl = `geo:${lat},${lng}?q=${lat},${lng}(鸟点)`;
  const webUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    window.location.href = geoUrl;
  } else {
    window.open(webUrl, '_blank');
  }
}
</script>
</body>
</html>
